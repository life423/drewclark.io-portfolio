name: Deploy to Azure Container Apps

# Builds the Docker image, pushes it to Docker Hub and deploys it to the
# landingpage Container App whenever main changes. The app's secrets come from
# this repo's secrets and reach the container only as secretref env vars.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read

concurrency:
  group: deploy-landingpage
  cancel-in-progress: false

env:
  APP_NAME: landingpage
  RESOURCE_GROUP: portfolio-apps

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LANDINGPAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LANDINGPAGE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LANDINGPAGE_AZURE_SUBSCRIPTION_ID }}

      - name: Update the app's secrets and registry login
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.LANDINGPAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.LANDINGPAGE_REGISTRY_PASSWORD }}
        run: |
          for name in OPENAI_API_KEY MONGODB_URI ADMIN_PASSWORD REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret for $name is missing"; exit 1; fi
          done
          az containerapp secret set -n "$APP_NAME" -g "$RESOURCE_GROUP" --output none --secrets \
            "openai-api-key=$OPENAI_API_KEY" \
            "mongodb-uri=$MONGODB_URI" \
            "admin-password=$ADMIN_PASSWORD"
          # The Docker Hub repo is private, so the app needs credentials to pull the image
          az containerapp registry set -n "$APP_NAME" -g "$RESOURCE_GROUP" --output none \
            --server docker.io --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD"
          # Let those updates finish so the deploy doesn't hit "operation in progress"
          for attempt in $(seq 1 24); do
            state=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.provisioningState -o tsv)
            [ "$state" = "Succeeded" ] && break
            echo "App is $state, waiting..."
            sleep 5
          done

      - name: Build, push and deploy the image
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.LANDINGPAGE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LANDINGPAGE_REGISTRY_PASSWORD }}
          containerAppName: ${{ env.APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToBuild: aiandrew631/landingpage:${{ github.sha }}
          environmentVariables: >-
            OPENAI_API_KEY=secretref:openai-api-key
            MONGODB_URI=secretref:mongodb-uri
            ADMIN_PASSWORD=secretref:admin-password

      - name: Check the new version is up
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 20); do
            if curl -fsS "https://$fqdn/api/health" > /dev/null; then
              echo "Healthy: https://$fqdn"
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://$fqdn/api/health did not respond within 5 minutes"
          exit 1
