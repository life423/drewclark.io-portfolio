name: Portfolio browser checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix app --legacy-peer-deps --no-audit --no-fund
      # The Ubuntu runner already includes Chrome and Edge. Reinstalling these
      # channels adds system-package downloads without improving test coverage.
      - run: npx playwright install --with-deps firefox webkit
        timeout-minutes: 5
      - run: npm run build
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
