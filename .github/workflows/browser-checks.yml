name: Portfolio browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix app --legacy-peer-deps --no-audit --no-fund
      # Chrome, Edge and Firefox's system libraries are already on the runner.
      # Fetch only Firefox here; the macOS job covers WebKit and Safari without
      # Ubuntu's extra font/media packages, whose mirror previously timed out.
      - run: npx playwright install firefox
        timeout-minutes: 3
      - run: npm run build
      - run: npm run test:ui -- --project=chrome --project=edge --project=firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  safari:
    name: WebKit and Safari (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix app --legacy-peer-deps --no-audit --no-fund
      # macOS needs no Linux apt dependencies. Use the pinned Playwright build.
      - run: npx playwright install webkit
        timeout-minutes: 3
      - run: npm run build
      # Option+Tab includes links; enable buttons too for the full keyboard
      # traversal assertions. Scope this preference to the test WebKit app.
      - name: Enable WebKit keyboard navigation
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - run: npm run test:ui -- --project=webkit --workers=1
      # Safari and its matching driver are bundled on the macOS runner.
      - run: sudo safaridriver --enable
      - run: node scripts/check-safari.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-test-results
          path: test-results/
          retention-days: 7
