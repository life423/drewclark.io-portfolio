        <!-- Who this site is about, for search engines: Drew and Andrew Clark are the same person -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Person",
                    "@id": "https://drewclark.io/#person",
                    "name": "Drew Clark",
                    "alternateName": "Andrew Clark",
                    "jobTitle": "Software Engineer",
                    "description": "Software engineer and full-stack web developer.",
                    "url": "https://drewclark.io/",
                    "sameAs": [
                        "https://github.com/life423"
                    ]
                },
                {
                    "@type": "WebSite",
                    "@id": "https://drewclark.io/#website",
                    "url": "https://drewclark.io/",
                    "name": "drewclark.io",
                    "description": "Drew Clark is a software engineer and full-stack web developer. Projects in Python, React and TypeScript, with an AI chat that answers questions about each one from its code on GitHub.",

                    "about": { "@id": "https://drewclark.io/#person" }
                }
            ]
        }
        </script>
        
        <!-- Preload largest contentful paint image - both WebP and JPG versions for browser compatibility -->
        <link rel="preload" href="/assets/sprout-mobile.webp" as="image" type="image/webp" media="(max-width: 1023px)" fetchpriority="high" />
        <link rel="preload" href="/assets/large-sprout.webp" as="image" type="image/webp" media="(min-width: 1024px)" fetchpriority="high" />
        
                
        <!-- Google Fonts - Lato - Optimized loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        
        <!-- Preload font CSS file with proper onload attribute to avoid render blocking -->
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap&text=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-%25%2F%5C%3A%3B" as="style" onload="this.onload=null;this.rel='stylesheet'">
        
        <!-- Fallback in case JavaScript is disabled -->
        <noscript>
            <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap&text=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-%25%2F%5C%3A%3B" rel="stylesheet">
        </noscript>
        <!-- Critical CSS inlined to prevent render blocking -->
        <style>
            /* Fallback font while Lato is loading */
            body {
                font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-display: swap;
                margin: 0;
                padding: 0;
                background-color: #1a1a1a;
                color: #f0f0f0;
            }
            
            /* Prevent content layout shifts while loading */
            #root {
                min-height: 100vh;
            }
            
            /* Loading state placeholder */
            .app-loading {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100%;
            }
        </style>
